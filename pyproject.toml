[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aex-tfanet"
version = "0.2.0"
description = "Adaptive Explainable Trust Framework for Secure Flying Ad Hoc Networks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AEX-TFANET Project" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "networkx>=3.2",
  "joblib>=1.3",
]

[project.optional-dependencies]
xai = ["shap>=0.44"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
aex-tfanet = "aex_tfanet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
